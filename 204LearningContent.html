<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Task B Inspector Certification Simulator</title>
<style>
:root{
  --bg:#0b1a23; --bg2:#0f2531; --panel:#133040; --panel2:#18394b; --edge:#2b5569;
  --txt:#e8f1f5; --mut:#9db8c6; --ember:#ff9a1f; --ember2:#ffd166; --cy:#56ccf2;
  --ok:#37d6a5; --okbg:#0f3b38; --bad:#ff6b7a; --badbg:#442230; --part:#f5c542; --partbg:#423a1a;
  --head:"Bahnschrift","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--txt);font-family:var(--body);line-height:1.5;min-height:100vh;
  background:radial-gradient(1100px 480px at 88% -8%,rgba(255,154,31,.16),transparent 62%),
             radial-gradient(900px 520px at -8% 108%,rgba(86,204,242,.12),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
h1,h2,h3{font-family:var(--head);letter-spacing:.005em;margin:0}
h1{font-size:clamp(1.7rem,4.6vw,2.5rem);line-height:1.1}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:.35em 0 .8em}
.mut{color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;background:rgba(8,20,28,.94);border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:30;backdrop-filter:blur(6px)}
.brand{display:flex;gap:10px;align-items:center;background:none;border:0;padding:4px;text-align:left;font-family:var(--head);font-size:1.02rem}
.brand svg{width:26px;height:26px}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:4px 10px;font-weight:600;font-size:.88rem;white-space:nowrap}
.chip b{color:var(--ember2)}
.chip.hot{background:var(--ember);color:#2a1500;border-color:var(--ember)}
.chip.hot b{color:#2a1500}
.ibtn{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:4px 10px;font-size:.85rem}
main{max-width:1000px;margin:0 auto;padding:20px 14px 80px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:10px;padding:18px}
.btn{background:var(--ember);color:#2a1500;border:0;border-radius:8px;padding:10px 20px;font-weight:700;font-size:1rem;transition:transform .08s,filter .15s}
.btn:hover:not([disabled]){filter:brightness(1.1);transform:translateY(-1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--txt);border:1px solid var(--edge)}
.btn.alt:hover:not([disabled]){background:var(--panel2)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-weight:600;margin:14px 0 5px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--txt);background:#0a1820;border:1px solid var(--edge);border-radius:8px;padding:10px 12px}
textarea{resize:vertical;min-height:130px;line-height:1.5}
select option{background:#0a1820}
.warn{background:var(--partbg);border:1px solid var(--part);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:.92rem}
.err{color:var(--bad);font-weight:600;min-height:1.4em}

/* hub */
.console{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:center;margin-bottom:18px}
.lvl{font-family:var(--head);font-size:1.6rem;color:var(--ember2)}
.thermo{position:relative;height:20px;border-radius:10px;background:linear-gradient(90deg,#241a78 0%,#6a1b9a 24%,#c2306b 44%,#ec5a2c 62%,#ff9a1f 80%,#ffe58a 100%);overflow:hidden;margin:12px 0 4px;border:1px solid var(--edge)}
.thermo .cv{position:absolute;top:0;bottom:0;right:0;background:#0a1820;transition:width .6s}
.thermo .tk{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.75)}
.ticks{position:relative;height:18px;font-size:.78rem;color:var(--mut)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.ticket{position:relative;text-align:left;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-left:5px solid var(--edge);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .15s}
.ticket:hover{transform:translateY(-2px);border-color:var(--ember)}
.ticket.prog{border-left-color:var(--ember)}
.ticket.clear{border-left-color:var(--ok)}
.tid{font-size:.8rem;color:var(--mut);font-weight:600}
.tag{display:inline-block;border-radius:5px;padding:2px 9px;font-size:.8rem;font-weight:700;border:1px solid var(--edge);width:fit-content}
.tag.prog{color:var(--ember2);border-color:var(--ember)}
.tag.clear{color:var(--ok);border-color:var(--ok)}
.bar{height:8px;border-radius:5px;background:#0a1820;overflow:hidden;border:1px solid var(--edge)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c2306b,#ff9a1f,#ffe58a);transition:width .4s}

/* question */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.step{min-width:40px;padding:5px 9px;border-radius:6px;border:1px solid var(--edge);background:var(--panel);font-weight:700;font-size:.85rem;text-align:center}
.step.cur{border-color:var(--ember);box-shadow:0 0 0 2px rgba(255,154,31,.35)}
.step.d{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.step.p{background:var(--partbg);border-color:var(--part);color:var(--part)}
.step.x{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:.9rem;margin-bottom:6px}
.qtext{font-size:1.15rem;font-weight:600;margin:6px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#0d212c;border:1px solid var(--edge);border-radius:8px;padding:11px 13px;margin:0 0 9px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--ember);background:#122a38}
.opt .ltr{flex:0 0 28px;height:28px;border-radius:6px;background:var(--panel);border:1px solid var(--edge);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt.sel{border-color:var(--ember);background:#33230f}
.opt.sel .ltr{background:var(--ember);color:#2a1500;border-color:var(--ember)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .ltr{background:var(--ok);color:#06251f}
.opt.bad{border-color:var(--bad);background:var(--badbg);opacity:.8}
.opt.gone{opacity:.25;text-decoration:line-through}
.fb{border-radius:8px;padding:10px 14px;margin-top:12px;border:1px solid;font-weight:600}
.fb.ok{background:var(--okbg);border-color:var(--ok);color:#b4f3df}
.fb.part{background:var(--partbg);border-color:var(--part);color:#ffe9a3}
.fb.bad{background:var(--badbg);border-color:var(--bad);color:#ffc7cd}
.fb.info{background:#10303f;border-color:var(--cy);color:#c6ecfa}
.fb ul{margin:6px 0 0;padding-left:20px;font-weight:500}
.seqi{display:flex;align-items:center;gap:10px;background:#0d212c;border:1px solid var(--edge);border-radius:8px;padding:10px 12px;margin:0 0 9px;cursor:grab}
.seqi .n{width:28px;height:28px;border-radius:6px;background:var(--panel);display:grid;place-items:center;font-weight:700}
.seqi .lab{flex:1;font-weight:600}
.seqi.ok{border-color:var(--ok);background:var(--okbg)}
.seqi.bad{border-color:var(--bad);background:var(--badbg)}
.mv{display:flex;gap:6px}
.mv button{width:34px;height:34px;border-radius:6px;background:var(--panel);border:1px solid var(--edge)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:center;margin:0 0 10px;padding:10px;border:1px solid var(--edge);border-radius:8px;background:#0d212c}
.mrow.ok{border-color:var(--ok);background:var(--okbg)}
.mrow.bad{border-color:var(--bad);background:var(--badbg)}
.sentence{font-size:1.15rem;line-height:2.6}
.sentence input{display:inline-block;width:min(230px,66vw);padding:5px 10px;margin:0 4px;text-align:center;font-weight:700;border-radius:6px;border-color:var(--ember);background:#2b200f}
.sentence input.ok{border-color:var(--ok);background:var(--okbg)}
.sentence input.part{border-color:var(--part);background:var(--partbg)}
.sentence input.bad{border-color:var(--bad);background:var(--badbg)}
.hint{font-family:Consolas,"Courier New",monospace;letter-spacing:.06em;color:var(--ember2);margin-top:6px}
.check{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.check li{display:flex;gap:10px;align-items:center;border:1px solid var(--edge);border-radius:8px;padding:8px 12px;background:#0d212c}
.check li.full{border-color:var(--ok);background:var(--okbg)}
.check li.part{border-color:var(--part);background:var(--partbg)}
.check .st{font-weight:700;min-width:70px}
.check .mk{margin-left:auto;font-weight:700;white-space:nowrap}
.model{border-left:4px solid var(--cy);background:#10303f;border-radius:0 8px 8px 0;padding:10px 14px;margin-top:12px}
.model h3{margin-bottom:4px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.stamp{display:inline-block;border:4px double var(--ok);color:var(--ok);border-radius:10px;padding:6px 18px;font-family:var(--head);font-size:1.7rem;transform:rotate(-4deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.hexes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:10px 0}
.hx{text-align:center;font-size:.85rem}
.hx .h{width:64px;height:72px;margin:0 auto 6px;display:grid;place-items:center;font-family:var(--head);font-size:1.1rem;font-weight:700;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ffe58a,#ff9a1f 55%,#c2306b);color:#2a1500}
.hx.off .h{background:#1d3c4c;color:#4b6f81}
.hx.off{opacity:.6}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{padding:6px 8px;border-bottom:1px solid var(--edge);text-align:left;font-size:.93rem}
.code{width:100%;font-family:Consolas,"Courier New",monospace;font-size:.92rem;resize:none}
.big{font-family:var(--head);font-size:3.4rem;line-height:1;color:var(--ember2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#06131a;border:1px solid var(--ember);color:var(--txt);padding:9px 18px;border-radius:8px;font-weight:600;z-index:60;max-width:92vw;text-align:center;animation:pop .3s}
.fxflash{animation:flash .5s}
.fxshake{animation:shake .4s}
@keyframes flash{from{box-shadow:0 0 0 4px rgba(55,214,165,.7)}to{box-shadow:0 0 0 0 transparent}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{from{transform:translateX(-50%) scale(.9);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@media (max-width:760px){
  .console,.cases{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr}
  .brand b{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.noprint{display:none!important}body{background:#fff;color:#000}.panel{background:#fff;border-color:#999}}

/* ===================== PROFESSIONAL THEME OVERRIDES ===================== */

  --bad:#c43d4b;

  --head:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;

  background:#17365d;border:1px solid #2e5b89;color:#fff;
  border-radius:12px;padding:11px 18px;box-shadow:0 8px 26px rgba(17,42,73,.2)
}

  .top{align-items:flex-start;padding:10px 12px}
  .stats{gap:5px}
  .chip{font-size:.78rem;padding:4px 8px}
  main{padding:16px 12px 56px}
  .panel{border-radius:13px}
  .ticket{padding:17px}
  .brand svg{width:26px;height:26px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}

/* =====================  MARKING ENGINE  ===================== */
function L(s){return s.split('|');}
function r2(n){return Math.round(n*100)/100;}
function norm(s){
  return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(/&/g,' and ').replace(/[^a-z0-9\s]/g,' ').replace(/\b(the|a|an|is|are)\b/g,' ').replace(/\s+/g,' ').trim();
}
function squash(s){return norm(s).replace(/ /g,'');}
/* Damerau-Levenshtein: a swapped pair of letters counts as ONE slip */
function dl(a,b){
  var al=a.length,bl=b.length,i,j,d=[];
  if(!al)return bl; if(!bl)return al;
  for(i=0;i<=al;i++){d[i]=[i];}
  for(j=0;j<=bl;j++){d[0][j]=j;}
  for(i=1;i<=al;i++){for(j=1;j<=bl;j++){
    var c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]){d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}
  }}
  return d[al][bl];
}
function tol(n){return n<=4?0:n<=7?1:n<=11?2:3;}
function near(x,y,exact,loose){
  if(x===y)return 0;
  if(exact)return Infinity;
  if(x.length===3&&y.length===3&&x.split('').sort().join('')===y.split('').sort().join(''))return 1;
  var d=dl(x,y),t=tol(y.length);
  if(loose&&y.length===4)t=1;
  return d<=t?d:Infinity;
}
function B(ans,nice,full,part,exact){return {ans:ans,nice:nice,full:L(full),part:part?L(part):[],exact:!!exact};}

/* ---- single blank ---- */
function gradeBlank(raw,b){
  var a=norm(raw),i,best=Infinity;
  if(!a)return {s:0,k:'empty'};
  var sq=a.replace(/ /g,''),toks=a.split(' ');
  for(i=0;i<b.full.length;i++){var d=near(sq,squash(b.full[i]),b.exact,true);if(d<best)best=d;}
  if(best===0)return {s:1,k:(sq===squash(b.ans)?'exact':'alt')};
  if(best<Infinity)return {s:1,k:'typo'};
  for(i=0;i<b.part.length;i++){
    var ps=squash(b.part[i]);
    if(near(sq,ps,b.exact,true)<Infinity)return {s:.5,k:'part'};
    if(b.part[i].indexOf(' ')<0&&toks.some(function(t){return t.length>=3&&near(t,ps,b.exact,true)<Infinity;}))return {s:.5,k:'part'};
  }
  /* answer contains an accepted term inside a longer phrase, e.g. "the loop structure" */
  for(i=0;i<b.full.length;i++){
    var f=squash(b.full[i]);
    if(f.length>=4&&!b.exact&&toks.length<=4&&toks.some(function(t){return near(t,f)<Infinity;}))return {s:1,k:'alt'};
  }
  return {s:0,k:'wrong'};
}

/* ---- rubric helpers for open answers ---- */
function mkCtx(raw,prep){
  var low=String(raw||'').toLowerCase();
  (prep||[]).forEach(function(p){low=low.replace(p[0],p[1]);});
  var n=norm(low);
  return {low:low,n:n,toks:n?n.split(' '):[],sq:n.replace(/ /g,'')};
}
function oneHit(c,a){
  a=a.trim();
  if(!a)return false;
  if(a.indexOf(' ')>=0){return c.sq.indexOf(squash(a))>=0;}
  if(a.charAt(a.length-1)==='*'){
    var b=a.slice(0,-1);
    return c.toks.some(function(t){return t.indexOf(b)===0||(b.length>=6&&dl(t.slice(0,b.length),b)<=1);});
  }
  if(a==='%')return c.low.indexOf('%')>=0;
  return c.toks.some(function(t){return t===a||near(t,a)<Infinity;});
}
function stemHit(c,stem){
  if(stem.indexOf('re:')===0){try{return new RegExp(stem.slice(3)).test(c.low);}catch(e){return false;}}
  var alts=stem.split('|');
  for(var i=0;i<alts.length;i++){if(oneHit(c,alts[i]))return true;}
  return false;
}
function altHit(c,alt){return alt.every(function(s){return stemHit(c,s);});}
function countHits(c,list){var n=0;list.forEach(function(s){if(stemHit(c,s))n++;});return n;}
function runConcepts(raw,rub){
  var c=mkCtx(raw,rub.prep),marks=0,items=[];

    var got=0,st='miss';
    if(k.full.some(function(a){return altHit(c,a);})){got=k.m;st='full';}
    else if((k.part||[]).some(function(a){return altHit(c,a);})){got=k.m*.5;st='part';}
    marks+=got;items.push({k:k.k,st:st,got:got,of:k.m});
  });
  return {marks:r2(marks),items:items};
}

function evalStages(raw){
  var c=mkCtx(raw),found=[],items=[];
  STG.forEach(function(s){
    if(stemHit(c,s.det)){found.push({k:s.k,e:countHits(c,s.exp)});}

function mLock(q){
 var R=QR(q),d=R.d;if(d.pick==null||R.done)return;
 R.att++;
 if(d.pick===q.a){
  var mk=q.m*[1,.5][R.att-1]*(d.removed.length?.5:1);
  d.msg={cls:'ok',html:'Correct.'};ui.fx=[{s:'.opt.sel',c:'fxflash'}];sfx('ok');finish(q,mk);
 }else{
  d.wrong.push(d.pick);d.pick=null;sfx('bad');
  if(R.att>=2){d.msg={cls:'bad',html:'Not correct. The right answer is now shown.'};finish(q,0);}
  else{d.msg={cls:'bad',html:'Not correct. One more try, for half marks.'};save();}
 }
 render();
}

/* ---- Sequence ---- */
function vSeq(q,R){
 var d=R.d;
 if(!d.order){var o;do{o=shuffle(range(q.items.length));}while(o.every(function(v,i){return v===i;}));d.order=o;}
 var h='<div class="qtext">'+esc(q.text)+'</div><p class="mut">Put the stages in order from first to last. Use the arrows (or drag on a computer), then lock in.</p>';
 d.order.forEach(function(it,pos){
  var cls='';
  if(d.flags&&!R.done)cls=d.flags[pos]?' ok':' bad';
  if(R.done)cls=it===pos?' ok':' bad';
  h+='<div class="seqi'+cls+'" draggable="'+(R.done?'false':'true')+'" data-pos="'+pos+'"><span class="n">'+(pos+1)+'</span><span class="lab">'+esc(q.items[it])+'</span>'+
   (R.done?'':'<span class="mv"><button data-act="sup" data-pos="'+pos+'" aria-label="Move up" '+(pos===0?'disabled':'')+'>\u25B2</button><button data-act="sdn" data-pos="'+pos+'" aria-label="Move down" '+(pos===q.items.length-1?'disabled':'')+'>\u25BC</button></span>')+'</div>';
 });
 if(R.done){
  h+='<div class="fb info"><b>Correct order:</b> '+q.items.map(esc).join(', then ')+'. '+esc(q.why)+'</div>';
 }
 h+=fbHtml(R);
 if(!R.done)h+='<div class="row" style="margin-top:12px"><button class="btn" data-act="slock">Lock in order</button><span class="mut">Attempt '+(R.att+1)+' of 3</span></div>';
 return h;
}
function sMove(q,pos,dir){
 var R=QR(q),d=R.d,t=pos+dir;if(R.done||t<0||t>=d.order.length)return;
 var x=d.order[pos];d.order[pos]=d.order[t];d.order[t]=x;d.flags=null;save();sfx('tap');render();
}
function sLock(q){
 var R=QR(q),d=R.d;if(R.done)return;
 R.att++;
 d.flags=d.order.map(function(it,pos){return it===pos;});
 var ok=d.flags.filter(Boolean).length,f=[1,.75,.5][Math.min(R.att,3)-1];
 R.best=Math.max(R.best||0,ok/q.items.length*q.m*f);
 if(ok===q.items.length){d.msg={cls:'ok',html:'Perfect order.'};sfx('ok');finish(q,R.best);}
 else if(R.att>=3){d.msg={cls:'bad',html:'Out of attempts. The correct order is shown. You keep your best score.'};sfx('bad');finish(q,R.best);}
 else{d.msg={cls:'part',html:ok+' of '+q.items.length+' stages are in the right position. Fix the red ones and lock in again.'};sfx(ok?'part':'bad');save();}
 render();
}

/* ---- Matching ---- */
function vMatch(q,R){
 var d=R.d;d.order=d.order||shuffle(range(q.opts.length));d.sel=d.sel||{};d.lock=d.lock||{};d.bad=d.bad||{};
 var h='<div class="qtext">'+esc(q.text)+'</div>';
 q.rows.forEach(function(r,i){
  var locked=d.lock[i]!==undefined,cls=locked?' ok':(d.bad[i]?' bad':'');
  var sel='';
  if(locked||R.done){sel='<div><b>'+esc(q.opts[i])+'</b></div>';}
  else{
   sel='<select data-act="msel" data-i="'+i+'" aria-label="Answer for '+esc(r)+'"><option value="">Choose...</option>'+
    d.order.map(function(o){return '<option value="'+o+'"'+(String(d.sel[i])===String(o)?' selected':'')+'>'+esc(q.opts[o])+'</option>';}).join('')+'</select>';
  }
  h+='<div class="mrow'+cls+'"><div>'+(locked||R.done?'':'')+esc(r)+'</div>'+sel+'</div>';
 });
 h+=fbHtml(R);
 if(!R.done)h+='<div class="row" style="margin-top:12px"><button class="btn" data-act="mcheck">Check matches</button><span class="mut">Attempt '+(R.att+1)+' of 3. Each answer is used once. Correct rows lock in.</span></div>';
 else{
  var fails=q.rows.filter(function(r,i){return d.lock[i]===undefined;});
  if(fails.length)h+='<div class="fb info">Correct matches for the rest are shown above.</div>';
 }
 return h;
}
function mCheck(q){
 var R=QR(q),d=R.d;if(R.done)return;
 var picks=[],dup=false,any=false;
 q.rows.forEach(function(r,i){
  if(d.lock[i]!==undefined)return;
  var v=d.sel[i];if(v===undefined||v==='')return;any=true;
  if(picks.indexOf(v)>=0)dup=true;picks.push(v);
 });
 if(!any){d.msg={cls:'bad',html:'Choose at least one match first.'};render();return;}
 if(dup){d.msg={cls:'bad',html:'Each answer can be used only once. Change the duplicates and check again.'};render();return;}
 R.att++;var f=[1,.7,.4][Math.min(R.att,3)-1],per=q.m/q.rows.length,good=0,badn=0;
 d.bad={};
 q.rows.forEach(function(r,i){
  if(d.lock[i]!==undefined)return;
  var v=d.sel[i];if(v===undefined||v==='')return;
  if(String(v)===String(i)){d.lock[i]=i;R.earn=(R.earn||0)+per*f;good++;}
  else{d.bad[i]=true;badn++;}
 });
 var left=q.rows.filter(function(r,i){return d.lock[i]===undefined;}).length;
 if(!left){d.msg={cls:'ok',html:'All matches correct.'};sfx('ok');finish(q,R.earn||0);}
 else if(R.att>=3){
  q.rows.forEach(function(r,i){if(d.lock[i]===undefined){d.lock[i]=undefined;}});
  d.msg={cls:'bad',html:'Out of attempts. Correct answers are shown for the rows you missed.'};sfx('bad');
  /* reveal: mark remaining rows as shown */
  q.rows.forEach(function(r,i){if(d.lock[i]===undefined)d.shown=true;});
  finish(q,R.earn||0);
 }else{d.msg={cls:badn?'part':'ok',html:good+' correct (locked in). '+badn+' to fix. Change the red rows and check again.'};sfx(badn?'part':'ok');save();}
 render();
}

/* ---- Cloze ---- */
function hintFor(b){return b.ans.split(' ').map(function(w){return w.charAt(0).toUpperCase()+' '+new Array(w.length).join('_ ');}).join('   ');}
function vCloze(q,R){
 var cz=CLOZE[q.id],d=R.d;d.lock=d.lock||[];d.vals=d.vals||[];d.fb=d.fb||[];d.best=d.best||[];
 var h='<div class="qtext">Complete the log entry. Spelling slips are forgiven and part-right answers earn part marks.</div><div class="sentence">';
 cz.parts.forEach(function(p){
  if(typeof p==='string'){h+=esc(p);return;}
  var i=p,fb=d.fb[i],cls='';
  if(d.lock[i])cls=' ok';else if(fb)cls=fb.s>0?' part':' bad';
  var v=R.done?(d.lock[i]?d.vals[i]:cz.blanks[i].nice):(ui.draft[q.id+':'+i]!==undefined?ui.draft[q.id+':'+i]:(d.vals[i]||''));
  h+='<input type="text" class="'+cls.trim()+'" data-blank="'+i+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Blank '+(i+1)+'" value="'+esc(v)+'" '+(d.lock[i]||R.done?'disabled':'')+'>';
 });
 h+='</div>';
 if(R.hint&&!R.done)h+='<div class="hint">Hints: '+cz.blanks.map(function(b,i){return (i+1)+') '+hintFor(b);}).join('     ')+'</div>';
 var lines=cz.blanks.map(function(b,i){
  var f=d.fb[i];if(!f)return '';
  return '<li>Blank '+(i+1)+': '+f.m+'</li>';
 }).join('');
 if(lines)h+='<div class="fb '+(R.done?'info':'part')+'"><ul>'+lines+'</ul></div>';
 if(R.done){
  h+='<div class="fb info"><b>Accepted answers:</b><ul>'+cz.blanks.map(function(b,i){return '<li>Blank '+(i+1)+': '+esc(b.nice)+'</li>';}).join('')+'</ul></div>';
 }
 if(!R.done){
  h+='<div class="row" style="margin-top:12px"><button class="btn" data-act="zcheck">Check answers</button>'+(R.hint?'':'<button class="btn alt" data-act="zhint">Show first letters (-10% marks)</button>')+
   '<span class="mut">Attempt '+(R.att+1)+' of 3</span></div>';
 }
 return h;
}
var ZMSG={exact:'Perfect.',alt:'Correct (accepted alternative).',typo:'Correct, spelling forgiven.',part:'Partly right (half credit). Make it more precise.',other:'Not this one.',wrong:'Not quite.',empty:'Left blank.'};
function zCheck(q){
 var R=QR(q),cz=CLOZE[q.id],d=R.d;if(R.done)return;
 $('#app').querySelectorAll('input[data-blank]').forEach(function(inp){var i=+inp.dataset.blank;if(!d.lock[i]){ui.draft[q.id+':'+i]=inp.value;}});
 R.att++;var f=[1,.8,.6][Math.min(R.att,3)-1],per=q.m/cz.blanks.length;
 cz.blanks.forEach(function(b,i){
  if(d.lock[i])return;
  var v=ui.draft[q.id+':'+i]||'',g=gradeBlank(v,b);
  d.vals[i]=v;
  d.best[i]=Math.max(d.best[i]||0,g.s*f);
  var msg=ZMSG[g.k];
  if(g.k==='typo')msg+=' Proper spelling: '+esc(b.nice)+'.';
  d.fb[i]={s:g.s,m:msg};
  if(g.s===1)d.lock[i]=true;
 });
 var left=cz.blanks.filter(function(b,i){return !d.lock[i];}).length,tot=d.best.reduce(function(a,b){return a+(b||0);},0)*per*(R.hint?.9:1);
 if(!left){sfx('ok');ui.fx=[{s:'.sentence',c:'fxflash'}];finish(q,tot);}
 else if(R.att>=3){sfx('bad');finish(q,tot);}
 else{sfx(d.fb.some(function(x){return x&&x.s>0&&x.s<1;})?'part':'bad');save();}
 render();
}

/* ---- Open answers ---- */
function vOpen(q,R){
 var o=OPEN[q.id],d=R.d,text=ui.draft[q.id]!==undefined?ui.draft[q.id]:(d.text||'');
 var h='<div class="qtext">'+esc(q.text)+'</div>';
 h+='<textarea id="open" aria-label="Your answer" '+(R.done?'disabled':'')+' placeholder="Write your answer in full sentences...">'+esc(text)+'</textarea>';
 if(R.hint&&!R.done)h+='<div class="fb info"><b>Your answer should cover:</b><ul>'+o.checklist.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul></div>';
 if(d.res){
  h+='<ul class="check" aria-label="Marking checklist">'+d.res.items.map(function(it){
   return '<li class="'+it.st+'"><span class="st">'+(it.st==='full'?'Covered':it.st==='part'?'Partly':'Missing')+'</span><span>'+esc(it.k)+'</span><span class="mk">'+r2(it.got)+' / '+it.of+'</span></li>';
  }).join('')+'</ul>';
 }
 h+=fbHtml(R);
 if(R.done)h+='<div class="model"><h3>Model answer</h3><p style="margin:0">'+esc(o.model)+'</p></div>';
 else{
  h+='<div class="row" style="margin-top:12px"><button class="btn" data-act="osub">'+(R.att?'Re-submit improved answer':'Submit for marking')+'</button>'+
   (R.att?'<button class="btn alt" data-act="ofin">Finish with my best answer</button>':'')+
   (R.hint?'':'<button class="btn alt" data-act="ohint">Show checklist (-10% marks)</button>')+
   '<span class="mut">Attempt '+(R.att+1)+' of 2'+(R.att?' (improved answers lose 10%)':'')+'</span></div>';
 }
 return h;
}
function oSubmit(q){
 var R=QR(q),o=OPEN[q.id],d=R.d,ta=$('#open');if(R.done)return;
 var text=ta?ta.value:'';ui.draft[q.id]=text;d.text=text;
 if(norm(text).split(' ').length<3){d.msg={cls:'bad',html:'Write a fuller answer first (at least a short sentence).'};render();return;}
 R.att++;var res=o.run(text),f=[1,.9][Math.min(R.att,2)-1],hm=R.hint?.9:1;
 var mk=r2(Math.min(q.m,res.marks)*f*hm);
 R.best=Math.max(R.best||0,mk);
 d.res=res;
 if(res.marks>=q.m-.001){d.msg={cls:'ok',html:'Excellent. Every key point is covered.'};sfx('ok');finish(q,R.best);}
 else if(R.att>=2){d.msg={cls:'info',html:'Final marks recorded. See the model answer below.'};sfx('part');finish(q,R.best);}
 else{
  d.msg={cls:'part',html:'You have '+res.marks+' of '+q.m+' marks so far. Add the missing or partly covered points, then re-submit, or finish with this answer.'};
  sfx(res.marks>0?'part':'bad');save();
 }
 render();
}
function oFinish(q){var R=QR(q);if(R.done||!R.att)return;var ta=$('#open');if(ta){ui.draft[q.id]=ta.value;R.d.text=ta.value;}R.d.msg={cls:'info',html:'Final marks recorded. See the model answer below.'};finish(q,R.best||0);render();}

/* ---- case summary + report ---- */
function viewSum(){
 var c=caseOf(ui.sumCase),mk=caseMarks(c),mx=caseMax(c);
 return '<section class="panel" style="text-align:center"><div class="stamp">Case cleared</div><h1 style="margin-top:14px">'+esc(c.t)+'</h1>'+
  '<p class="mut">'+c.tid+'</p><div class="big">'+mk+'<span class="mut" style="font-size:1.3rem"> / '+mx+'</span></div><p>marks in this case. Total so far: <b>'+totalMarks()+' / '+TOTAL+'</b>, '+S.xp+' XP.</p>'+
  '<div class="row" style="justify-content:center"><button class="btn" data-act="'+(doneCount()===QS.length?'report':'hub')+'">'+(doneCount()===QS.length?'View final report':'Back to case board')+'</button></div></section>';
}
function code(){
 var d=new Date().toISOString().slice(0,10),raw=[S.name,S.sid||'-',totalMarks()+'/'+TOTAL,S.xp+'XP',d].join(' | ');
 var h=2166136261,s='ITQAN-TASKB'+raw;
 for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
 return raw+' | '+(h>>>0).toString(36).toUpperCase().slice(0,6);
}
function viewReport(){
 var p=pct(),all=doneCount()===QS.length;
 var rows=QS.slice().sort(function(a,b){return a.n-b.n;}).map(function(q){var R=S.q[q.id];return '<tr><td>Q'+q.n+'</td><td>'+(R&&R.done?R.marks+' / '+q.m:'Not answered')+'</td></tr>';}).join('');
 var cr=CASES.map(function(c){return '<tr><td>'+esc(c.t)+'</td><td>'+caseMarks(c)+' / '+caseMax(c)+'</td></tr>';}).join('');
 var bd=Object.keys(BADGES).map(function(k){var on=S.badges.indexOf(k)>=0;return '<div class="hx '+(on?'':'off')+'"><div class="h">'+BADGES[k][0]+'</div><b>'+BADGES[k][1]+'</b></div>';}).join('');
 var h='<section class="panel"><h1>'+(all?'Final report':'Progress report')+'</h1><p><b>'+esc(S.name)+'</b>'+(S.sid?' (ID '+esc(S.sid)+')':'')+'</p>'+
  '<div class="row" style="gap:28px"><div><div class="big">'+Math.round(p)+'%</div><div class="mut">'+totalMarks()+' of '+TOTAL+' marks</div></div><div><div class="lvl">'+(doneCount()?levelFor(p):'Trainee')+'</div><span class="chip">XP <b>'+S.xp+'</b></span> <span class="chip">Best streak <b>'+S.best+'</b></span></div></div>'+
  '<h2 style="margin-top:16px">By case</h2><table><tr><th>Case</th><th>Marks</th></tr>'+cr+'</table>'+
  '<h2>By question</h2><table><tr><th>Question</th><th>Marks</th></tr>'+rows+'</table><h2>Endorsements</h2><div class="hexes">'+bd+'</div>';
 if(all){
  h+='<h2>Submission code</h2><p class="mut">Copy this code into the Moodle assignment or text box so your instructor can record your result.</p>'+
   '<textarea class="code" id="code" rows="2" readonly>'+esc(code())+'</textarea><div class="row noprint" style="margin-top:8px"><button class="btn" data-act="copy">Copy code</button><button class="btn alt" data-act="print">Print</button></div>';
 }
 h+='<div class="row noprint" style="margin-top:18px"><button class="btn alt" data-act="hub">Back to case board</button><button class="btn alt" data-act="reset">'+(ui.confirmReset?'Tap again to erase all progress':'Start over')+'</button></div></section>';
 return h;
}

/* =====================  RENDER + EVENTS  ===================== */
function view(){
 if(!S)return viewWelcome();
 switch(S.screen){case 'q':return viewQ();case 'sum':return viewSum();case 'report':return viewReport();default:return viewHub();}
}
function render(){
 app.innerHTML=topbar()+'<main>'+view()+'</main>';
 ui.fx.forEach(function(f){var el=$(f.s);if(el){el.classList.remove(f.c);void el.offsetWidth;el.classList.add(f.c);}});
 ui.fx=[];
 if(ui.focus){ui.focus=false;var t=$('.sentence input:not([disabled])')||$('#open:not([disabled])');if(t)t.focus();}
}
function go(screen){S.screen=screen;ui.confirmReset=false;save();render();window.scrollTo(0,0);}
function openQ(i){S.screen='q';S.qi=i;QR(QM[caseOf(S.cs).qs[i]]).d.msg=QR(QM[caseOf(S.cs).qs[i]]).d.msg||null;ui.focus=true;save();render();window.scrollTo(0,0);}
function curQ(){return QM[caseOf(S.cs).qs[S.qi]];}

var A={
 start:function(){
  var nm=($('#nm').value||'').trim().replace(/\s+/g,' '),sid=($('#sid').value||'').trim();
  ui.tmpName=nm;ui.tmpId=sid;
  if(nm.length<2){$('#werr').textContent='Please type your name to begin.';return;}
  var saved=store.get(keyFor(nm,sid)),loaded=false;
  if(saved){try{S=JSON.parse(saved);loaded=true;}catch(e){S=null;}}
  if(!S||S.v!==2){S=fresh(nm,sid);loaded=false;}
  S.screen='hub';store.set(PFX+'last',JSON.stringify({n:nm,s:sid}));save();render();
  if(loaded)toast('Welcome back, '+nm+'. Progress restored.');
 },
 hub:function(){if(S)go('hub');},
 case:function(t){S.cs=t.dataset.c;var c=caseOf(S.cs);var f=c.qs.map(function(id,i){return i;}).filter(function(i){return !(S.q[c.qs[i]]&&S.q[c.qs[i]].done);})[0];openQ(f===undefined?0:f);},
 goq:function(t){openQ(+t.dataset.i);},
 prev:function(){if(S.qi>0)openQ(S.qi-1);},
 next:function(){var c=caseOf(S.cs);if(S.qi<c.qs.length-1)openQ(S.qi+1);},
 endcase:function(){var c=caseOf(S.cs);if(!caseDone(c))return;ui.sumCase=c.id;sfx('win');go('sum');},
 report:function(){go('report');},
 mpick:function(t){var R=QR(curQ());R.d.pick=+t.dataset.i;sfx('tap');render();},
 mlock:function(){mLock(curQ());},
 m5050:function(){
  var q=curQ(),R=QR(q),d=R.d;
  var wrong=range(q.opts.length).filter(function(i){return i!==q.a&&d.wrong.indexOf(i)<0;});
  d.removed=shuffle(wrong).slice(0,2);if(d.removed.indexOf(d.pick)>=0)d.pick=null;
  R.hint=true;S.hints++;save();render();
 },
 sup:function(t){sMove(curQ(),+t.dataset.pos,-1);},
 sdn:function(t){sMove(curQ(),+t.dataset.pos,1);},
 slock:function(){sLock(curQ());},
 mcheck:function(){mCheck(curQ());},
 zcheck:function(){zCheck(curQ());},
 zhint:function(){var q=curQ(),R=QR(q);document.querySelectorAll('input[data-blank]').forEach(function(i){ui.draft[q.id+':'+i.dataset.blank]=i.value;});R.hint=true;S.hints++;save();render();},
 osub:function(){oSubmit(curQ());},
 ofin:function(){oFinish(curQ());},
 ohint:function(){var q=curQ(),R=QR(q),ta=$('#open');if(ta)ui.draft[q.id]=ta.value;R.hint=true;S.hints++;save();render();},
 copy:function(){
  var ta=$('#code');ta.select();var ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(function(){toast('Code copied');});return;}
  toast(ok?'Code copied':'Press Ctrl+C to copy the selected code');
 },
 print:function(){window.print();},
 mute:function(){mute=!mute;store.set(PFX+'mute',mute?'1':'0');if(!mute)sfx('tap');render();},
 reset:function(){
  if(!ui.confirmReset){ui.confirmReset=true;render();return;}
  var n=S.name,s=S.sid;store.del(keyFor(n,s));S=fresh(n,s);ui.draft={};ui.confirmReset=false;save();render();toast('Progress erased.');
 }
};
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t||t.disabled||t.tagName==='SELECT')return;
 var f=A[t.dataset.act];if(f)f(t);
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.dataset&&t.dataset.act==='msel'&&S){QR(curQ()).d.sel[t.dataset.i]=t.value;save();}
});
document.addEventListener('input',function(e){
 var t=e.target;if(!S)return;
 if(t.id==='open')ui.draft[curQ().id]=t.value;
 else if(t.dataset&&t.dataset.blank!==undefined)ui.draft[curQ().id+':'+t.dataset.blank]=t.value;
});
document.addEventListener('keydown',function(e){
 var t=e.target;
 if(t&&t.id==='nm'&&e.key==='Enter'){A.start();return;}
 if(t&&t.dataset&&t.dataset.blank!==undefined&&e.key==='Enter'){e.preventDefault();A.zcheck();}
});
/* drag and drop for the sequence question (desktop) */
document.addEventListener('dragstart',function(e){var s=e.target.closest&&e.target.closest('.seqi');if(s){ui.drag=+s.dataset.pos;e.dataTransfer.setData('text/plain','x');e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',function(e){if(e.target.closest&&e.target.closest('.seqi'))e.preventDefault();});
document.addEventListener('drop',function(e){
 var s=e.target.closest&&e.target.closest('.seqi');if(!s||ui.drag===null||!S)return;
 e.preventDefault();var q=curQ(),R=QR(q),d=R.d,to=+s.dataset.pos,from=ui.drag;ui.drag=null;
 if(R.done||from===to)return;
 var it=d.order.splice(from,1)[0];d.order.splice(to,0,it);d.flags=null;save();render();
});

render();
})();
</script>
